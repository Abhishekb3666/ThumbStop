[project]
name = "reachsim"
version = "0.1.0"
description = "Simulate how an audience reacts to your short-form video before you post it. Get a reach score, weak spots and better hooks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest"]

[project.scripts]
reachsim = "reachsim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
